<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        color: #18181b;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f4f4f5;
          background: #18181b;
        }
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p {
        margin: 0 0 12px;
        color: #71717a;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        background: #18181b;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #3f3f46;
      }
      button:disabled {
        background: #a1a1aa;
        cursor: default;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #f4f4f5;
          color: #18181b;
        }
        button:hover {
          background: #d4d4d8;
        }
      }
      .note {
        margin-top: 12px;
        font-size: 11px;
        color: #a1a1aa;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }
      .status.ok {
        color: #16a34a;
      }
      .status.err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>🗓️ ZhiNote 会议抓取</h1>
    <p>在你已登录的会议页面上点击下面的按钮，先核对关键信息，再发送到 ZhiNote。</p>
    <button id="capture" type="button">抓取本页会议信息</button>
    <div id="status" class="status"></div>
    <div class="note">
      只在你点击时读取<strong>当前页面</strong>的可见文字；不读取 cookie、密码或登录信息；只发送到你自己的
      ZhiNote。
    </div>
    <script src="popup.js"></script>
  </body>
</html>
