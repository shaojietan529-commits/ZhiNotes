<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e5e5e5;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .header .logo {
      width: 22px;
      height: 22px;
      background: #18181b;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }
    .body { padding: 14px 16px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: white;
    }
    .field input:focus { border-color: #18181b; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #18181b; color: white; }
    .btn-secondary {
      background: transparent;
      color: #666;
      border: 1px solid #ddd;
      margin-top: 8px;
      font-size: 12px;
      padding: 7px;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #ecfdf5; color: #065f46; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }
    .settings { padding: 14px 16px; border-top: 1px solid #e5e5e5; }
    .settings summary {
      font-size: 12px;
      color: #666;
      cursor: pointer;
      list-style: none;
    }
    .settings summary::before { content: "⚙️ "; }
    .settings-body { margin-top: 10px; }
    .chip {
      display: inline-block;
      font-size: 11px;
      background: #f0f0f0;
      color: #555;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Z</div>
    <h1>ZhiNotes Web Clipper</h1>
  </div>

  <div class="body" id="main-view">
    <div class="field">
      <label>标题</label>
      <input type="text" id="title" placeholder="页面标题">
    </div>
    <div class="field">
      <label>保存方式</label>
      <select id="clip-mode">
        <option value="full">完整网页（正文 HTML）</option>
        <option value="selection">选中内容</option>
        <option value="link">仅链接 + 标题</option>
      </select>
    </div>
    <button class="btn btn-primary" id="save-btn">📥 保存到 ZhiNotes</button>
    <div class="status" id="status"></div>
  </div>

  <div class="settings">
    <details>
      <summary>设置</summary>
      <div class="settings-body">
        <div class="field">
          <label>ZhiNotes 地址</label>
          <select id="server-url">
            <option value="https://zhi-note.com">zhi-note.com</option>
            <option value="https://zhi-notes.vercel.app">zhi-notes.vercel.app</option>
            <option value="http://localhost:3000">localhost:3000 (开发)</option>
          </select>
        </div>
        <div class="field">
          <label>API Key <span class="chip">可选</span></label>
          <input type="text" id="api-key" placeholder="留空则使用登录态 Cookie">
        </div>
        <button class="btn btn-secondary" id="save-settings">保存设置</button>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
